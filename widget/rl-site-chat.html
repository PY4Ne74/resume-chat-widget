<script>
/* RL · Chat — wires the robert-lamb.com design's mock chat to the live API.
 *
 * Install: Elementor → Custom Code → new snippet named "RL · Chat",
 *          Location "</body> - End", Priority 11, Condition: Entire Site.
 *          Priority 11 matters — it must load AFTER "RL · Script" (10).
 *
 * This file deliberately touches NO page markup and NO generated CSS class
 * names. It anchors only on data-* attributes and #rl-ask-input, which the
 * design package documents as stable. That is what lets it survive a fresh
 * export of home-page.json / site-body.html from Claude Design: re-importing
 * the design wipes those two files, but never touches this snippet.
 */
(function () {
  "use strict";

  /* ---- CONFIG ------------------------------------------------------- */
  var API_URL = "https://resume-chat-widget.vercel.app/api/chat";
  // Leave null to keep the design's own CTA links (/#contact, /#portfolio).
  // Set a Calendly URL only if you want the chat's "Book a call" to bypass
  // the on-page booking popup.
  var BOOKING_URL = null;
  // Render the conversation inline in the hero instead of the cramped
  // floating panel (210x422). Set false to fall back to the panel.
  var INLINE_HERO = true;
  // Once a conversation starts, step the hero's headline/sub-head/chips
  // aside so the transcript gets the full column. Set false to keep them.
  var IMMERSIVE = true;
  // Sub-line under the "Ask Robert's AI" label. Set to "" to show nothing.
  var TAGLINE = "Trained on my career, philosophy and approach \u2014 not a script";
  // The 3 hero suggestion chips: [button label, what it actually sends].
  // Set to null to keep whatever the design ships.
  var CHIPS = [
    ["Why hire you?",        "I'm hiring a VP of Marketing \u2014 why should I shortlist you?"],
    ["First 90 days",        "What would your first 90 days look like leading our marketing?"],
    ["Where our funnel leaks", "Our funnel is leaking qualified leads \u2014 where would you look first?"]
  ];
  // The animated placeholder phrases cycling in the empty input.
  // Set to null to keep the design's own list.
  var TYPED_PHRASES = [
    "Why should I shortlist you for a VP Marketing role\u2026",
    "What would your first 90 days look like\u2026",
    "Walk me through a funnel you actually fixed\u2026",
    "How do you produce agency-quality work without an agency\u2026",
    "Our pipeline stalls after the demo request \u2014 where do you look\u2026"
  ];
  /* ------------------------------------------------------------------- */

  var d = document;
  if (d.documentElement.hasAttribute("data-rl-chat-live")) return; // no double-init
  d.documentElement.setAttribute("data-rl-chat-live", "1");

  var panel = d.querySelector("[data-chat]");
  var seed = d.querySelector("[data-chat-seed]");
  var reply = d.querySelector("[data-chat-reply]");
  var toggle = d.querySelector("[data-chat-toggle]");
  var chatForm = panel && panel.querySelector("form");
  var chatInput = d.getElementById("rl-chat-input");
  var askForm = d.querySelector("[data-ask-form]");
  var askInput = d.getElementById("rl-ask-input");

  // If the design ever drops these hooks, do nothing rather than throw —
  // the mock keeps working and the page is unaffected.
  if (!panel || !seed) return;
  if (INLINE_HERO && (!askForm || !askInput)) return;
  if (!INLINE_HERO && (!chatForm || !chatInput)) return;

  var history = [];
  var conversationId = null;
  var sending = false;

  /* ---- Where the transcript lives ------------------------------------ *
   * Inline mode puts it directly above the hero's ask form, so the form
   * reads as the composer beneath the conversation — the layout of an
   * actual chat window rather than a 210px sidebar.
   *
   * heroCol is reached by walking UP from the form, never by class name:
   * the design's generated classes (rl19, rl1f, ...) change on every
   * export and must never be used as selectors.                          */

  var heroCol = INLINE_HERO ? askForm.parentElement : null;
  var messagesEl = d.createElement("div");
  messagesEl.className = INLINE_HERO ? "rlc-messages rlc-inline" : "rlc-messages";
  messagesEl.setAttribute("aria-live", "polite");
  messagesEl.hidden = true;

  seed.hidden = true;
  if (reply) reply.hidden = true;

  if (INLINE_HERO) {
    heroCol.insertBefore(messagesEl, askForm);
    // The floating panel is not used at all in this mode.
    panel.hidden = true;
    if (toggle) toggle.setAttribute("hidden", "hidden");
  } else {
    seed.parentElement.insertBefore(messagesEl, (reply || seed).nextSibling);
  }

  var style = d.createElement("style");
  style.textContent =
    "[data-chat-seed],[data-chat-reply]{display:none!important}" +
    ".rlc-messages{display:flex;flex-direction:column;gap:10px}" +
    /* Only the floating-panel mode scrolls internally. The inline hero
       transcript deliberately has NO inner scrollbar - it grows with the
       page and the page itself scrolls, so it never reads as an iframe
       embedded in the hero. */
    ".rlc-messages:not(.rlc-inline){max-height:46vh;margin:10px 0 0;overflow-y:auto;scrollbar-width:thin}" +
    ".rlc-msg{font:inherit;line-height:1.5;border-radius:12px;padding:9px 12px;max-width:92%;word-wrap:break-word}" +
    ".rlc-user{align-self:flex-end;background:rgba(94,234,212,.14);color:#D7F7F0}" +
    ".rlc-bot{align-self:flex-start;background:rgba(255,255,255,.05);color:#E6EAF2}" +
    ".rlc-err{align-self:flex-start;background:rgba(255,120,120,.12);color:#FFC9C9}" +
    ".rlc-msg p{margin:0 0 .5em}.rlc-msg p:last-child{margin-bottom:0}" +
    ".rlc-msg ul{margin:.25em 0 .5em;padding-left:1.1em}.rlc-msg li{margin:.2em 0}" +
    ".rlc-msg strong{color:#5EEAD4;font-weight:700}" +
    ".rlc-msg a{color:#5EEAD4;text-decoration:underline}" +
    ".rlc-typing{align-self:flex-start;display:flex;gap:4px;padding:10px 12px}" +
    ".rlc-typing span{width:6px;height:6px;border-radius:50%;background:#5EEAD4;opacity:.45;animation:rlc-blink 1.2s infinite}" +
    ".rlc-typing span:nth-child(2){animation-delay:.2s}.rlc-typing span:nth-child(3){animation-delay:.4s}" +
    "@keyframes rlc-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}" +
    "@media (prefers-reduced-motion:reduce){.rlc-typing span{animation:none}}" +

    /* ---- inline hero conversation ---- */
    ".rlc-inline{width:100%;max-width:720px;margin:0 auto 18px;text-align:left;" +
      "padding:18px;box-sizing:border-box;" +
      "border:1px solid rgba(94,234,212,.18);border-radius:16px;" +
      "background:rgba(9,12,19,.55);backdrop-filter:blur(6px)}" +
    ".rlc-inline .rlc-msg{max-width:88%}" +
    /* Once a conversation is running, every other child of the hero column
       steps aside so the transcript owns the space. Structural, not
       class-based, so a fresh design export cannot break it. */
    "[data-rl-chat-active] > *:not(.rlc-inline):not([data-ask-form]){" +
      "display:none!important}" +
    /* The design layers an animated fake placeholder ([data-typed] cycling
       through phrases, plus a blinking [data-caret]) over the real input.
       Once the visitor is actually in a conversation it competes with what
       they are typing, so it goes away. Anchored on data-* attributes, not
       the generated rl1j/rl1k class names. */
    "[data-rl-chat-active] [data-hint]{display:none!important}" +
    ".rlc-tagline{display:block;width:100%;margin:6px 0 0;font-size:11px;line-height:1.35;font-weight:400;letter-spacing:.01em;text-transform:none;opacity:.62}" +
    "@media (max-width:767px){.rlc-inline{padding:14px;border-radius:14px}" +
      ".rlc-inline .rlc-msg{max-width:96%}}";
  d.head.appendChild(style);

  if (BOOKING_URL) {
    var bookLink = panel.querySelector('a[href*="#contact"]');
    if (bookLink) { bookLink.href = BOOKING_URL; bookLink.target = "_blank"; bookLink.rel = "noopener"; }
  }

  /* ---- GA4 / dataLayer tracking --------------------------------------- *
   * Routes through window.rlTrack from the "RL · Tracking" snippet so chat
   * events take the exact same dataLayer + gtag path as resume_download,
   * schedule_click and the rest — one convention, not two.
   *
   * Resolved at CALL time, not init time, on purpose: RL · Chat runs at
   * priority 10 and RL · Tracking at 11, so rlTrack does not exist yet when
   * this file first executes. It always does by the time a visitor types.
   * Falls back to its own push if that snippet is ever removed.
   *
   * The visitor's typed text is deliberately NEVER sent to GA4 — only its
   * length. Chip labels are our own static copy, so those are safe.        */

  function track(name, params) {
    params = params || {};
    try {
      if (typeof window.rlTrack === "function") { window.rlTrack(name, params); return; }
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push(Object.assign({ event: name }, params));
      if (typeof window.gtag === "function") window.gtag("event", name, params);
    } catch (e) {}
  }

  var messageCount = 0;
  var startFired = false;
  var engagedFired = false;
  var ENGAGED_AT_TURN = 3;

  /* ---- Rendering (ported from the tested widget) --------------------- *
   * Everything is built with createElement/textContent. Model and visitor
   * text never touches innerHTML, so there is no injection path.          */

  function appendInline(parent, text) {
    var parts = text.split(/(\*\*[^*]+\*\*|\[[^\]]+\]\([^)]+\))/g);
    parts.forEach(function (part) {
      if (!part) return;
      var link = part.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
      if (part.indexOf("**") === 0 && part.lastIndexOf("**") === part.length - 2 && part.length > 4) {
        var b = d.createElement("strong");
        b.textContent = part.slice(2, -2);
        parent.appendChild(b);
      } else if (link && /^(https?:\/\/|#|\/)/i.test(link[2])) {
        var a = d.createElement("a");
        a.href = link[2];
        a.textContent = link[1];
        if (/^https?:/i.test(link[2])) { a.target = "_blank"; a.rel = "noopener"; }
        parent.appendChild(a);
      } else {
        parent.appendChild(d.createTextNode(part));
      }
    });
  }

  function renderFormatted(container, text) {
    var list = null;
    text.split("\n").forEach(function (line) {
      var t = line.trim();
      if (t.indexOf("- ") === 0) {
        if (!list) { list = d.createElement("ul"); container.appendChild(list); }
        var li = d.createElement("li");
        appendInline(li, t.slice(2));
        list.appendChild(li);
      } else if (t) {
        list = null;
        var p = d.createElement("p");
        appendInline(p, t);
        container.appendChild(p);
      }
    });
  }

  /* With the inline transcript flowing in the page there is no inner
   * scrollbar to nudge, so the PAGE is what has to move. Keep the composer
   * in view: it sits directly under the transcript, so pinning it near the
   * bottom of the viewport keeps both the newest text and the input visible.
   * Throttled, and instant (not smooth) while streaming - calling a smooth
   * scroll on every token yanks the page out from under whoever is reading. */
  var lastFollow = 0;
  function keepInView(smooth) {
    if (!INLINE_HERO) { messagesEl.scrollTop = messagesEl.scrollHeight; return; }
    var now = Date.now();
    if (!smooth && now - lastFollow < 120) return;
    lastFollow = now;
    var r = askForm.getBoundingClientRect();
    if (r.bottom > window.innerHeight || r.top < 0) {
      try { askForm.scrollIntoView({ block: "end", behavior: smooth ? "smooth" : "auto" }); }
      catch (e) { askForm.scrollIntoView(false); }
    }
  }

  function addMessage(kind, text) {
    var el = d.createElement("div");
    el.className = "rlc-msg " + (kind === "user" ? "rlc-user" : kind === "error" ? "rlc-err" : "rlc-bot");
    if (kind === "bot") renderFormatted(el, text); else el.textContent = text;
    messagesEl.appendChild(el);
    keepInView(true);
    return el;
  }

  function showTyping() {
    var t = d.createElement("div");
    t.className = "rlc-typing";
    t.id = "rlcTyping";
    t.innerHTML = "<span></span><span></span><span></span>"; // static markup only
    messagesEl.appendChild(t);
    keepInView(true);
  }
  function hideTyping() { var t = d.getElementById("rlcTyping"); if (t) t.remove(); }

  var activated = false;
  function activate() {
    if (messagesEl.hidden) messagesEl.hidden = false;
    if (!INLINE_HERO) {
      panel.hidden = false;
      if (toggle) toggle.setAttribute("aria-expanded", "true");
      return;
    }
    if (IMMERSIVE && !activated) {
      activated = true;
      heroCol.setAttribute("data-rl-chat-active", "1");
      // Replaces the animated hint the CSS above just hid.
      if (askInput && !askInput.placeholder) askInput.placeholder = "Ask a follow-up\u2026";
    }
  }

  function setSending(on) {
    sending = on;
    var form = INLINE_HERO ? askForm : chatForm;
    var input = INLINE_HERO ? askInput : chatInput;
    if (input) input.disabled = on;
    var btn = form.querySelector('button[type="submit"]');
    if (btn) btn.disabled = on;
  }

  /* ---- The actual call ----------------------------------------------- */

  async function send(text, entryPoint) {
    text = (text || "").trim();
    if (!text || sending) return;

    activate();
    addMessage("user", text);
    if (chatInput) chatInput.value = "";
    if (askInput) askInput.value = "";
    setSending(true);
    showTyping();

    messageCount++;
    var evt = {
      entry_point: entryPoint || "panel_form",
      turn: messageCount,
      message_length: text.length
    };
    if (conversationId) evt.conversation_id = conversationId;
    track("chat_message", evt);

    try {
      var res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: history, conversationId: conversationId })
      });

      var cid = res.headers.get("X-Conversation-Id");
      if (cid) conversationId = cid;

      // Fired here rather than before the call so the conversation_id is
      // attached — that id is what ties a GA4 event back to the full
      // transcript in the dashboard.
      if (!startFired) {
        startFired = true;
        track("chat_start", {
          entry_point: entryPoint || "panel_form",
          conversation_id: conversationId || ""
        });
      }
      if (!engagedFired && messageCount >= ENGAGED_AT_TURN) {
        engagedFired = true;
        track("chat_engaged", {
          turn: messageCount,
          conversation_id: conversationId || ""
        });
      }

      // Errors come back as JSON; a good reply is a raw text stream.
      var ct = res.headers.get("Content-Type") || "";
      if (!res.ok || ct.indexOf("application/json") !== -1) {
        hideTyping();
        track("chat_error", { reason: "bad_response", status: res.status });
        addMessage("error", "Something went wrong on my end — mind trying again, or just reach out directly?");
        return;
      }

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var full = "";
      var streamEl = null;
      var rawEl = null;

      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        var piece = decoder.decode(chunk.value, { stream: true });
        if (!piece) continue;
        if (!streamEl) {
          hideTyping();
          streamEl = d.createElement("div");
          streamEl.className = "rlc-msg rlc-bot";
          rawEl = d.createElement("span");
          streamEl.appendChild(rawEl);
          messagesEl.appendChild(streamEl);
        }
        full += piece;
        rawEl.textContent = full; // live typewriter, plain text while streaming
        keepInView(false);
      }

      if (!streamEl || !full.trim()) {
        hideTyping();
        track("chat_error", { reason: "empty_reply" });
        addMessage("error", "Something went wrong on my end — mind trying again, or just reach out directly?");
        return;
      }

      // Re-render once complete so bullets and bold become real elements.
      streamEl.textContent = "";
      renderFormatted(streamEl, full.trim());
      keepInView(true);

      history.push({ role: "user", content: text });
      history.push({ role: "assistant", content: full.trim() });
    } catch (err) {
      hideTyping();
      track("chat_error", { reason: "network" });
      addMessage("error", "Couldn't reach the server — mind trying again, or just reach out directly?");
    } finally {
      setSending(false);
    }
  }

  /* ---- Copy overrides -------------------------------------------------- *
   * Chip labels, what they send, the animated placeholder phrases and the
   * tagline all live HERE rather than in the design package, because a fresh
   * export of home-page.json overwrites the markup and would silently revert
   * them. Anchored on data-* hooks only, never generated class names.        */

  if (TAGLINE) {
    // The row holding the "Ask Robert's AI" label and the Try it / send
    // buttons is reached via [data-ask-shuffle], a stable hook; the label is
    // its first child. Nothing here depends on a generated class name.
    var shuffleBtn = askForm && askForm.querySelector("[data-ask-shuffle]");
    var labelRow = shuffleBtn && shuffleBtn.parentElement;
    var labelEl = labelRow && labelRow.firstElementChild;
    if (labelRow && !askForm.querySelector(".rlc-tagline")) {
      var tag = d.createElement("span");
      tag.className = "rlc-tagline";
      tag.textContent = TAGLINE;
      // Inserted AFTER the label/buttons row, not inside the label. Putting it
      // inside widened the label enough to wrap the send button onto its own
      // line; as a sibling it gets a full line of its own and the row above is
      // left exactly as the design laid it out.
      labelRow.parentNode.insertBefore(tag, labelRow.nextSibling);
    }
  }

  if (TYPED_PHRASES && TYPED_PHRASES.length) {
    var typedEl = d.querySelector("[data-typed]");
    if (typedEl) {
      /* RL · Script parses data-phrases into a local array ONCE at init, and
       * it runs before this file, so rewriting the attribute here changes
       * nothing - it is already holding the old list in a closure. Swap the
       * node instead: the design's typewriter carries on animating a node
       * that is no longer in the document (harmless and invisible) while our
       * clone, with our phrases, takes its place on screen. Only [data-typed]
       * is replaced, so the design's own show/hide of the [data-hint] wrapper
       * keeps working untouched. */
      var ours = typedEl.cloneNode(false);
      ours.setAttribute("data-phrases", JSON.stringify(TYPED_PHRASES));
      typedEl.parentNode.replaceChild(ours, typedEl);

      var reduceMotion = window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduceMotion) {
        ours.textContent = TYPED_PHRASES[0];
      } else {
        // Same cadence as the design's own typewriter so it reads identically.
        var pi = 0, ci = 0, erasing = false;
        (function tick() {
          var phrase = TYPED_PHRASES[pi], wait;
          if (!erasing) {
            ci++;
            if (ci >= phrase.length) { erasing = true; wait = 2400; }
            else wait = 42 + Math.random() * 38;
          } else {
            ci -= 3;
            if (ci <= 0) { ci = 0; erasing = false; pi = (pi + 1) % TYPED_PHRASES.length; wait = 420; }
            else wait = 18;
          }
          ours.textContent = phrase.slice(0, Math.max(0, ci));
          setTimeout(tick, wait);
        })();
      }

      // "Try it" fills the input from that same stale array, so take it over
      // the same way the forms are taken over: capture phase, then stop the
      // design's own handler from running.
      var shuffle = d.querySelector("[data-ask-shuffle]");
      if (shuffle && askInput) {
        var shuffleIdx = -1;
        shuffle.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopImmediatePropagation();
          shuffleIdx = (shuffleIdx + 1) % TYPED_PHRASES.length;
          askInput.value = TYPED_PHRASES[shuffleIdx].replace(/\u2026$/, "");
          askInput.dispatchEvent(new Event("input", { bubbles: true }));
          askInput.focus();
        }, true);
      }
    }
  }

  if (CHIPS && CHIPS.length) {
    d.querySelectorAll("[data-ask]").forEach(function (btn, i) {
      if (!CHIPS[i]) return;
      btn.textContent = CHIPS[i][0];
      btn.setAttribute("data-ask", CHIPS[i][1]);
    });
  }

  /* ---- Take over the mock's handlers ---------------------------------- *
   * RL · Script already bound submit handlers that call preventDefault()
   * and e.target.reset(). Listening in the CAPTURE phase and calling
   * stopImmediatePropagation() means we read the value before that reset
   * runs, and the canned reply never fires.                               */

  if (chatForm) chatForm.addEventListener("submit", function (e) {
    e.preventDefault();
    e.stopImmediatePropagation();
    send(chatInput && chatInput.value, "panel_form");
  }, true);

  if (askForm) {
    askForm.addEventListener("submit", function (e) {
      e.preventDefault();
      e.stopImmediatePropagation();
      send(askInput && askInput.value, "hero_form");
    }, true);
  }

  // Hero suggestion chips ("Audit my funnel", "Show me the numbers", …)
  d.querySelectorAll("[data-ask]").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopImmediatePropagation();
      // The chip label is our own static copy, not visitor input, so it is
      // safe to pass to GA4 — it is the useful part of this event.
      track("chat_chip_click", { chip_text: btn.getAttribute("data-ask") || "" });
      send(btn.getAttribute("data-ask"), "chip");
    }, true);
  });

  // Panel opens vs. conversations actually started. Deliberately does NOT
  // stop propagation — the design's own toggle handler must still run.
  if (toggle) {
    toggle.addEventListener("click", function () {
      if (panel.hidden) track("chat_open", {});
    }, true);
  }
})();
</script>
