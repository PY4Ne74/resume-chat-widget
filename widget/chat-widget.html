<!-- ============================================================
  Robert Lamb resume-site chat widget
  Paste this entire block into an Elementor "HTML" widget.
  Edit the 3 config values right below before publishing.
============================================================= -->
<style>
  .rl-chat {
    --bg-1:#090C13; --bg-2:#0E121C; --text:#F5F7FA; --text-dim:#A0ACBE;
    --teal:#5EEAD4; --steel:#8CA7C4; --muted:#3A4358; --hairline:#1A2030; --on-teal:#090C13;
    max-width:640px; margin:0 auto;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  .rl-chat * { box-sizing:border-box; }
  .rl-chat-panel {
    background:linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-1) 100%);
    border:1px solid var(--hairline); border-radius:20px; padding:16px; overflow:hidden;
  }
  .rl-chat-messages { max-height:420px; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:14px; }
  .rl-chat-messages:not(:empty) { padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--hairline); }
  .rl-msg { max-width:88%; padding:12px 15px; border-radius:14px; font-size:0.95rem; line-height:1.5; white-space:pre-wrap; }
  .rl-msg-user { align-self:flex-end; background:var(--teal); color:var(--on-teal); border-bottom-right-radius:4px; font-weight:500; }
  .rl-msg-assistant {
    align-self:flex-start; background:linear-gradient(150deg, rgba(245,247,250,0.06), rgba(245,247,250,0.02));
    border:1px solid var(--hairline); color:var(--text); border-bottom-left-radius:4px;
  }
  .rl-msg-assistant strong { color:var(--teal); font-weight:700; }
  .rl-msg-assistant p.rl-line { margin:0 0 8px; }
  .rl-msg-assistant p.rl-line:last-child { margin-bottom:0; }
  .rl-msg-assistant ul.rl-bullets { margin:2px 0 8px; padding-left:20px; }
  .rl-msg-assistant ul.rl-bullets:last-child { margin-bottom:0; }
  .rl-msg-assistant ul.rl-bullets li { margin-bottom:5px; }
  .rl-msg-assistant ul.rl-bullets li:last-child { margin-bottom:0; }
  .rl-msg-error { align-self:flex-start; background:rgba(239,100,97,0.1); border:1px solid rgba(239,100,97,0.3); color:#EF6461; }
  .rl-typing { align-self:flex-start; display:flex; gap:4px; padding:12px 15px; }
  .rl-typing span { width:6px; height:6px; border-radius:50%; background:var(--teal); opacity:0.4; animation:rl-blink 1.2s infinite; }
  .rl-typing span:nth-child(2){ animation-delay:0.2s; } .rl-typing span:nth-child(3){ animation-delay:0.4s; }
  @keyframes rl-blink { 0%,80%,100%{opacity:0.3;} 40%{opacity:1;} }
  .rl-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .rl-chip {
    border:1px solid var(--hairline); background:rgba(245,247,250,0.03); color:var(--text-dim);
    font-size:0.82rem; padding:8px 14px; border-radius:999px; cursor:pointer;
    transition:background 0.15s,border-color 0.15s,color 0.15s;
  }
  .rl-chip:hover { background:rgba(94,234,212,0.08); border-color:rgba(94,234,212,0.4); color:var(--text); }
  .rl-cta-row { display:none; justify-content:center; margin-bottom:14px; }
  .rl-cta-row.rl-visible { display:flex; }
  .rl-cta-btn { text-align:center; text-decoration:none; padding:11px 28px; border-radius:12px; font-size:0.9rem; font-weight:600; }
  .rl-cta-primary { background:var(--teal); color:var(--on-teal); }

  .rl-input-wrap {
    position:relative; border-radius:18px; padding:16px 18px 14px; margin-bottom:14px;
    background:linear-gradient(150deg, rgba(245,247,250,0.05), rgba(245,247,250,0.015));
    border:1px solid rgba(94,234,212,0.18);
  }
  .rl-input-wrap::before {
    content:""; position:absolute; top:0; left:16px; right:16px; height:1px;
    background:linear-gradient(90deg, rgba(94,234,212,0) 0%, rgba(94,234,212,0.55) 50%, rgba(94,234,212,0) 100%);
  }
  .rl-chat-input {
    width:100%; background:transparent; border:none; color:var(--text); font-size:1rem;
    resize:none; font-family:inherit; padding:0 0 14px; min-height:44px;
  }
  .rl-chat-input::placeholder { color:var(--text-dim); }
  .rl-chat-input:focus { outline:none; }
  .rl-input-footer { display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:12px; border-top:1px solid var(--hairline); }
  .rl-ai-label {
    display:inline-flex; align-items:center; gap:7px; font-size:10.5px; font-weight:700;
    letter-spacing:0.18em; text-transform:uppercase; color:var(--teal); white-space:nowrap;
  }
  .rl-ai-dot { width:6px; height:6px; border-radius:50%; background:var(--teal); flex:none; }
  .rl-input-actions { display:flex; align-items:center; gap:8px; flex:none; }
  .rl-example-btn {
    background:rgba(245,247,250,0.04); border:1px solid var(--hairline); color:var(--text-dim);
    font-size:10.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
    padding:8px 14px; border-radius:999px; cursor:pointer; transition:border-color 0.15s,color 0.15s;
  }
  .rl-example-btn:hover { border-color:rgba(94,234,212,0.4); color:var(--text); }
  .rl-chat-send {
    background:var(--teal); border:none; color:var(--on-teal); width:38px; height:38px;
    border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .rl-chat-send:disabled { opacity:0.5; cursor:not-allowed; }
  .rl-chat-send svg { width:16px; height:16px; }
  @media (max-width:480px){ .rl-chat-messages{ max-height:340px; } }
</style>

<div class="rl-chat" id="rlChat">
  <div class="rl-chat-panel">
    <div class="rl-chat-messages" id="rlMessages"></div>
    <div class="rl-input-wrap">
      <textarea class="rl-chat-input" id="rlInput" rows="1" placeholder="Tell me about your business and what you're trying to achieve..."></textarea>
      <div class="rl-input-footer">
        <span class="rl-ai-label"><span class="rl-ai-dot"></span>Ask Robert's AI</span>
        <div class="rl-input-actions">
          <button type="button" class="rl-example-btn" id="rlExampleBtn">Example</button>
          <button type="button" class="rl-chat-send" id="rlSend" aria-label="Send">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14L14 6M14 6H7M14 6V13"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="rl-chips" id="rlChips">
      <button type="button" class="rl-chip" data-prompt="I run a B2B SaaS company and need to build lead generation from scratch.">B2B SaaS, need lead gen</button>
      <button type="button" class="rl-chip" data-prompt="I run a small agency or local business and want to grow revenue without a big marketing budget.">Small business, tight budget</button>
      <button type="button" class="rl-chip" data-prompt="We're launching or rebranding and need a website and marketing assets fast.">Rebrand / new launch</button>
    </div>
    <div class="rl-cta-row" id="rlCtaRow">
      <a href="#" class="rl-cta-btn rl-cta-primary" id="rlCtaBook" target="_blank" rel="noopener">Book a 15-min call</a>
    </div>
  </div>
</div>

<script>
(function () {
  // ---- CONFIG: edit these two before publishing ----
  var API_URL = "https://resume-chat-widget.vercel.app/api/chat";
  var CALENDLY_URL = "https://calendly.com/YOUR-LINK";
  // ------------------------------------------------------

  document.getElementById("rlCtaBook").href = CALENDLY_URL;

  var messagesEl = document.getElementById("rlMessages");
  var inputEl = document.getElementById("rlInput");
  var sendBtn = document.getElementById("rlSend");
  var chipsEl = document.getElementById("rlChips");
  var ctaRow = document.getElementById("rlCtaRow");
  var exampleBtn = document.getElementById("rlExampleBtn");
  var EXAMPLE_PROMPTS = [
    "I run a B2B SaaS company and need to build lead generation from scratch.",
    "I run a small agency or local business and want to grow revenue without a big marketing budget.",
    "We're launching or rebranding and need a website and marketing assets fast."
  ];

  var history = [];
  var sending = false;

  function addMessage(role, text) {
    var div = document.createElement("div");
    div.className = "rl-msg " + (role === "user" ? "rl-msg-user" : role === "error" ? "rl-msg-error" : "rl-msg-assistant");
    if (role === "assistant") {
      renderFormattedText(div, text);
    } else {
      div.textContent = text;
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  // Renders plain text where lines starting with "- " become a real bullet
  // list, and **bold** segments become <strong>. Built entirely via
  // createElement/textContent (never innerHTML with model or user text) so
  // there's no injection risk.
  function renderFormattedText(container, text) {
    var lines = text.split("\n");
    var currentList = null;
    lines.forEach(function (line) {
      var trimmed = line.trim();
      if (trimmed.indexOf("- ") === 0) {
        if (!currentList) {
          currentList = document.createElement("ul");
          currentList.className = "rl-bullets";
          container.appendChild(currentList);
        }
        var li = document.createElement("li");
        appendInlineFormatted(li, trimmed.slice(2));
        currentList.appendChild(li);
      } else if (trimmed) {
        currentList = null;
        var p = document.createElement("p");
        p.className = "rl-line";
        appendInlineFormatted(p, trimmed);
        container.appendChild(p);
      }
    });
  }

  // Splits on **bold** markers and appends alternating text nodes / <strong>
  // elements to parent. No innerHTML involved, so this is safe for
  // untrusted (model or user) text.
  function appendInlineFormatted(parent, text) {
    var parts = text.split(/(\*\*[^*]+\*\*)/g);
    parts.forEach(function (part) {
      if (part.indexOf("**") === 0 && part.lastIndexOf("**") === part.length - 2 && part.length > 4) {
        var strong = document.createElement("strong");
        strong.textContent = part.slice(2, -2);
        parent.appendChild(strong);
      } else if (part) {
        parent.appendChild(document.createTextNode(part));
      }
    });
  }

  function showTyping() {
    var div = document.createElement("div");
    div.className = "rl-typing";
    div.id = "rlTypingIndicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    var el = document.getElementById("rlTypingIndicator");
    if (el) el.remove();
  }

  function setSending(state) {
    sending = state;
    sendBtn.disabled = state;
    inputEl.disabled = state;
  }

  async function sendMessage(text) {
    if (!text || !text.trim() || sending) return;
    chipsEl.style.display = "none";
    addMessage("user", text.trim());
    inputEl.value = "";
    setSending(true);
    showTyping();

    try {
      var res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text.trim(), history: history })
      });

      var contentType = res.headers.get("Content-Type") || "";

      // Non-streaming path: any error response is still plain JSON.
      if (!res.ok || contentType.indexOf("application/json") !== -1) {
        hideTyping();
        addMessage("error", "Something went wrong on my end — mind trying again, or just reach out directly?");
        return;
      }

      // Streaming path: read raw text chunks as they arrive and show them
      // live (typewriter effect), then re-render the final text as proper
      // bullets/bold once the stream completes.
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var fullText = "";
      var streamDiv = null;
      var rawTextEl = null;

      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        var piece = decoder.decode(chunk.value, { stream: true });
        if (!piece) continue;

        if (!streamDiv) {
          hideTyping();
          streamDiv = document.createElement("div");
          streamDiv.className = "rl-msg rl-msg-assistant";
          rawTextEl = document.createElement("span");
          rawTextEl.className = "rl-streaming-raw";
          streamDiv.appendChild(rawTextEl);
          messagesEl.appendChild(streamDiv);
        }

        fullText += piece;
        rawTextEl.textContent = fullText;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      if (!streamDiv || !fullText.trim()) {
        hideTyping();
        addMessage("error", "Something went wrong on my end — mind trying again, or just reach out directly?");
        return;
      }

      streamDiv.innerHTML = "";
      renderFormattedText(streamDiv, fullText.trim());
      messagesEl.scrollTop = messagesEl.scrollHeight;

      history.push({ role: "user", content: text.trim() });
      history.push({ role: "assistant", content: fullText.trim() });
      ctaRow.classList.add("rl-visible");
    } catch (err) {
      hideTyping();
      addMessage("error", "Couldn't reach the server — mind trying again, or just reach out directly?");
    } finally {
      setSending(false);
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", function () { sendMessage(inputEl.value); });
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(inputEl.value);
    }
  });
  chipsEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".rl-chip");
    if (btn) sendMessage(btn.getAttribute("data-prompt"));
  });
  // Fills the input with a random sample prompt rather than sending — lets
  // the visitor see what a good question looks like and edit before sending.
  exampleBtn.addEventListener("click", function () {
    var prompt = EXAMPLE_PROMPTS[Math.floor(Math.random() * EXAMPLE_PROMPTS.length)];
    inputEl.value = prompt;
    inputEl.focus();
  });
})();
</script>
